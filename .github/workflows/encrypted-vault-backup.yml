name: THE SABBiR OS 12-Hour Encrypted Vault & Drive Backup

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vault-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Encrypted Vault Backup
        env:
          VAULT_MASTER_SECRET: ${{ secrets.VAULT_MASTER_SECRET || 'the-sabbir-os-zero-knowledge-vault-master-2026' }}
          GOOGLE_DRIVE_BACKUP_WEBHOOK_URL: ${{ secrets.GOOGLE_DRIVE_BACKUP_WEBHOOK_URL }}
        run: node scripts/autonomous/backup-vault-sync.mjs

      - name: Commit & Push Encrypted Vault
        run: |
          git config --global user.name "THE SABBiR OS Vault Sentinel"
          git config --global user.email "vault@sabbir.nav.bd"
          git add data/vault/sabbir-os-state.vault.enc data/vault/backup-history.json
          if git diff --staged --quiet; then
            echo "No changes in encrypted vault."
          else
            git commit -m "chore(vault): 12-hour AES-256-GCM encrypted state snapshot [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
