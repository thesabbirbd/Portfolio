name: THE SABBiR OS Autonomous User Job Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'User Job Ticket ID (e.g. JOB-1234)'
        required: true
        default: 'JOB-9999'
      agent_id:
        description: 'Input-to-Action Agent ID'
        required: true
        default: 'image-converter-agent'
      payload:
        description: 'User input parameters or serialized JSON'
        required: false
        default: 'Sample cloud job runner input'
  repository_dispatch:
    types: [user-job-dispatch]

permissions:
  contents: write

jobs:
  run-user-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Cloud Agent Job Runner
        run: |
          node scripts/autonomous/run-agent-job.mjs \
            --job-id "${{ github.event.inputs.job_id || github.event.client_payload.job_id || 'JOB-AUTO' }}" \
            --agent-id "${{ github.event.inputs.agent_id || github.event.client_payload.agent_id || 'image-converter-agent' }}" \
            --payload "${{ github.event.inputs.payload || github.event.client_payload.payload || 'Dispatched via GitHub' }}"

      - name: Commit Encrypted Artifact Output
        run: |
          git config --global user.name "THE SABBiR Cloud Worker"
          git config --global user.email "worker@sabbir.nav.bd"
          git add data/artifacts/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(job): automated artifact release for ${{ github.event.inputs.job_id || 'JOB-AUTO' }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
