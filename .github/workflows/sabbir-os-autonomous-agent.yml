name: THE SABBiR OS Autonomous Brain & Discovery Agent

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-os-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Autonomous OS Agent Harvester & SVG Cover Generator
        run: node scripts/autonomous-os-agent.mjs

      - name: Verify Content Integrity & Build Gates
        run: npm run content:check && npx tsc --noEmit

      - name: Commit & Push Autonomous Discoveries
        run: |
          git config --global user.name "THE SABBiR OS Autonomous Brain"
          git config --global user.email "autonomous@sabbir.nav.bd"
          git add src/data/auto-pulse.json public/assets/covers/
          if git diff --staged --quiet; then
            echo "No new autonomous discoveries to commit."
          else
            git commit -m "chore(autonomous): self-evolving OS brain harvest & covers update [skip ci]"
            git push origin main
          fi
